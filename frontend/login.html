<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Login - Tourist Club</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9;">
  <div style="max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
    <h2 style="text-align: center; color: #333;">Tourist Club</h2>
    <p style="text-align: center; color: #666; margin-bottom: 20px;">Авторизація в системі</p>
    
    <form action='/login' method='POST'>
      <label style="font-weight: bold; color: #555;">Логін:</label><br>
      <input type='text' name='username' placeholder='Введіть ваш логін' style="margin-bottom: 15px; width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;"><br>
      
      <label style="font-weight: bold; color: #555;">Пароль:</label><br>
      <input type='password' name='password' placeholder='Введіть пароль' style="margin-bottom: 20px; width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;"><br>
      
      <button type='submit' style="width: 100%; padding: 12px; background-color: #007BFF; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;">Увійти</button>
    </form>
  </div>
</body>
</html>
